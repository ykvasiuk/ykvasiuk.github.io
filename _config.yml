title: Yurii Kvasiuk
tagline: Cosmology · AI for Science
description: >-
  Yurii Kvasiuk — Senior Postdoctoral Fellow at Perimeter Institute.
  Modelling and measuring the Universe, and building AI that can do science.
url: https://ykvasiuk.github.io
baseurl: ""
lang: en

author:
  name: Yurii Kvasiuk
  role: Senior Postdoctoral Fellow
  institution: Perimeter Institute for Theoretical Physics
  location: Waterloo, ON, Canada

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  projects:
    output: false   # write-ups feed the Research page only; set true to publish a page per project
    permalink: /projects/:path/

defaults:
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .claude
